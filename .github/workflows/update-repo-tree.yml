name: Update repository tree

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repo-tree:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate repository tree
        run: |
          mkdir -p docs/governance
          {
            echo "# Repository Tree"
            echo
            echo "## Status"
            echo
            echo "This file is generated from the current Git repository tree using \`git ls-tree -r --name-only HEAD\`."
            echo
            echo "It is intended to support repository governance, overwrite review, and model-file discovery for the Tessera Identity System."
            echo
            echo "## Governance Use"
            echo
            echo "Before making repo-wide governance claims, review this file and \`docs/governance/model-file-manifest.md\`."
            echo
            echo "The manifest identifies which files are considered active, governance-relevant, provisional, superseded, or archival. This tree identifies which files exist in the repository at generation time."
            echo
            echo "## Full Git-Derived Tree"
            echo
            echo "\`\`\`text"
            git ls-tree -r --name-only HEAD
            echo "\`\`\`"
          } > docs/governance/repo-tree.md

      - name: Commit repository tree if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/governance/repo-tree.md
          if git diff --cached --quiet; then
            echo "Repository tree already current."
          else
            git commit -m "Update generated repository tree"
            git push
          fi
